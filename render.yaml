services:
  - type: web
    name: alfred
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd alfred-poc && uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1 --timeout-keep-alive 75
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: QLOO_API_KEY
        sync: false
      - key: QLOO_BASE_URL
        value: https://hackathon.api.qloo.com
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_MODEL
        value: anthropic/claude-sonnet-4.5
      - key: LIVE_LLM_MODEL
        value: openai/gpt-4o-mini
      - key: ALFRED_NOMINATIM_USER_AGENT
        sync: false
